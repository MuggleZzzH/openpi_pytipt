# LIBERO Object 基准配置示例
# 继承基础配置，只修改特定部分

defaults:
  - stage11_unified_pool  # 继承主配置
  - _self_

# 覆盖任务配置
task:
  benchmark_name: "libero_object"          # 🎯 更改为object基准
  task_selection_mode: "auto_subset"       # 自动获取前几个任务
  auto_task_count: 5                       # 只选择前5个任务
  num_parallel_envs: 2

# 覆盖SwanLab配置（分层命名）  
logging:
  swanlab_project: "ript-eval"
  swanlab_run_name: "object_${exp_name}"   # 🏷️ object前缀
  swanlab_tags: ["libero_object", "stage11", "ript-vla"]

# 实验名称
exp_name: "object_eval_subset"


