# Stage 11 Unified Sample Pool Configuration
# 测试统一样本池训练方法：你想要的理想架构
# 🔥 与原版RIPT对齐的配置

defaults:
  - paths  # 🔥 引入paths配置
  - _self_

exp_name: stage11_unified_pool_test

# === 基本路径配置（使用paths.yaml中的配置）===
policy_path: "/zhaohan/ZJH/openpi_pytorch/checkpoints/pi0_libero_pytorch"
norm_stats_path: "/zhaohan/ZJH/openpi_pytorch/lerobot_dataset/norm_stats.json"
output_dir: "/zhaohan/ZJH/openpi_pytorch/experiments/stage11_unified_pool"  # 🔥 直接使用绝对路径
data_prefix: "/zhaohan/ZJH/openpi_pytorch/datasets"  # 🔥 直接使用绝对路径
# === 任务配置 ===
task:
  benchmark_name: "libero_spatial"         # 🔥 修复：使用小写格式
  task_names_to_use:
    # 🎯 多任务测试：选择4个不同的spatial任务进行轮换
    - "pick_up_the_black_bowl_from_table_center_and_place_it_on_the_plate"
    - "pick_up_the_black_bowl_next_to_the_plate_and_place_it_on_the_plate"
    # - "pick_up_the_black_bowl_on_the_stove_and_place_it_on_the_plate"
    # - "pick_up_the_black_bowl_on_the_cookie_box_and_place_it_on_the_plate"
    # # 💡 要测试单任务模式，注释掉除第一个外的所有任务
    # # 💡 要测试更多任务，取消注释下面的任务：
    # - "pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate"
    # - "pick_up_the_black_bowl_next_to_the_cookie_box_and_place_it_on_the_plate"
    # - "pick_up_the_black_bowl_next_to_the_ramekin_and_place_it_on_the_plate"
    # - "pick_up_the_black_bowl_on_the_ramekin_and_place_it_on_the_plate"
    # - "pick_up_the_black_bowl_on_the_wooden_cabinet_and_place_it_on_the_plate"
    # - "pick_up_the_black_bowl_in_the_top_drawer_of_the_wooden_cabinet_and_place_it_on_the_plate"
  num_parallel_envs: 2  # 🔥 单环境避免内存问题
  max_episode_length: 100  # 🔥 进一步限制episode长度减少样本数

# 🔥 LIBERO数据集配置（与原版RIPT对齐）
use_libero_demos: true                   # 关闭demo初始状态，匹配 2_pi0 的默认reset
libero_data_prefix: "/zhaohan/ZJH/openpi_pytorch/datasets"   # 🔥 直接使用绝对路径
benchmark_name: "libero_spatial"          # 与task.benchmark_name保持一致

# 🔥 数据集配置（与原版RIPT对齐）
dataset:
  seq_len: 600
  frame_stack: 1
  obs_seq_len: 1
  load_obs_for_pretrain: true
  load_next_obs: true
  get_pad_mask: true
  load_state: true  # 🔥 关键：加载MuJoCo状态数据
  # 🔥 添加缺失的配置项
  _target_: pi0.ript.utils.libero_utils_ript_aligned.build_dataset_ript_aligned

# === 算法配置 ===
algo:
  demo_batch_size: 1
  rloo_batch_size: 2  # 🔥 减少episodes数量避免OOM
  lr: 1e-5
  gradient_accumulation_steps: 2  # 🔥 增加累积步数补偿小batch
  collection_cfg_scale: 1.0
  cfg_uncond_weight: 0.1
  rollout_skip_threshold: 3
  enable_rollout_stats_tracking: false
  use_val_init: false

# === 评估配置 ===
rollout:
  enabled: true                # 全局开关
  # 二选一设置评估频率（优先按step）：
  # 1) 显式按步触发（推荐）：
  steps: 1                    # 每多少个训练step评估一次；-1 表示不用该项
  # 2) 按 epoch 比例触发（可选）：
  interval: 1                   # 每个"逻辑epoch"评估一次（当 steps 为 -1 时生效）

  rollouts_per_env: 2          # 每个任务评估多少个 rollouts
  num_parallel_envs: 2          # 评估时并行环境数（单卡安全值 1~2）
  max_episode_length: ${task.max_episode_length}  # 默认沿用任务上限
  
  # 🎬 评估阶段视频保存配置
  n_video: 0                    # 常规评估时每个任务保存多少个视频（0=不保存）
  n_video_final: 1              # 最终评估时每个任务保存多少个视频（用于最终展示）

# === 策略配置 ===
policy:
  cfg_enabled: false  # 启用CFG测试
  train_expert_only: true
  freeze_vision_encoder: true

# === 🚀 数据处理配置 - 启用统一样本池 ===
# 注意：dataset配置已在上面定义，这里添加额外的处理配置
data_processing:
  num_init_states: 50
  state_dim: 92
  
  # 启用SO100处理 + 统一样本池
  use_so100_processing: true
  
  # Legacy配置（SO100模式下忽略）
  windowing_mode: last
  window_stride: 10
  max_windows_per_episode: 1

# === 训练配置 ===
training:
  num_train_steps: 1  # 快速测试
  seed: 42
  n_steps: 3
  rollout_steps: 1
  log_interval: 1
  save_interval: 1
  load_obs: true
  save_freq: 1

# === 日志配置 ===
logging:
  use_wandb: false
  log_freq: 1
  group: null
  mode: online
  project: "openpi-ript-vla"
  resume: true
  save_code: true

# === 特性开关 - 简化配置 ===
features:
  use_ript_vla_runner: false
  enable_parallel_envs: true    
  enable_true_parallel_envs: true
  enable_smart_sampling: false
  use_parallel_init_state: true  # 🔥 重新启用并行状态设置（已修复格式问题）

  # 🎬 训练阶段视频保存配置（数据收集时）
  save_video: true                   # 训练时视频保存总开关
  n_video_training: 1                # 训练时每次rollout保存多少个视频（当save_video=true时生效）
  enable_file_counter: false
  adaptive_cfg: false
  early_stop_percentage: 1.0

  # 控制是否禁用动作裁剪（并行路径）
  disable_action_clipping: false

  # 🔥 RIPT对齐：并行环境初始状态同步控制
  parallel_env_sync:
    enabled: true                    # 启用同步控制
    fixed_init_state_id: -1         # 🔄 -1 表示让wrapper按顺序轮换，不固定特定ID
    verify_sync: true               # 验证状态同步性
    sync_tolerance: 1e-6            # 状态差异容忍度
    random_sampling: false          # 🚫 禁用随机采样，确保确定性
  
  # 动态采样配置
  dynamic_sampling:
    enabled: false
    
  # 🔥 新增: 采样策略配置，与RIPT-VLA对齐
  sampling_strategy:
    # 初始状态采样策略: random (随机时间步) | first (首帧) | round_robin (轮询时间步)
    init_state_sampling: "random"
    # 任务选择策略: random (随机任务) | round_robin (轮询任务)  
    task_selection: "random"
    # 随机采样的种子控制（用于可复现实验）
    sampling_seed: 42

# === 🎯 统一样本池配置说明 ===
# 
# 新的训练流程：
# 1. 收集3个episodes (rloo_batch_size=3)
# 2. 统一生成所有样本到样本池
# 3. 打散样本顺序，破除相关性
# 4. 按固定batch_size=32切分样本
# 5. 标准梯度累积训练
#
# 预期效果：
# - 固定batch大小，标准深度学习范式
# - 样本随机化，更好的训练稳定性
# - 简化的优势传播，无复杂映射
# - 更高的数据利用率

# === 训练配置（与原版RIPT对齐）- 已合并到上面的training部分 ===

# === 数据加载配置（与原版RIPT对齐）===
train_dataloader:
  batch_size: 6  # 🔥 与原版RIPT对齐
  shuffle: true
  num_workers: 6
  persistent_workers: false
  pin_memory: true

# === 日志配置（与原版RIPT对齐）- 已合并到上面的logging部分 ===

# === 可调超参数（避免硬编码） ===
unified_pool_batch_size: 8   # 统一样本池每个batch大小 - 修复显存累积后适当提升
unified_pool_shuffle: true     # 是否在样本池层面打散样本顺序

# 🔥 与原版RIPT对齐的参数说明：
# 1. rloo_batch_size: 控制每次收集的episodes数量
# 2. unified_pool_batch_size: 控制训练时的batch大小
# 3. gradient_accumulation_steps: 控制梯度累积
# 4. collection_cfg_scale: 控制CFG引导强度
# 5. load_state: true - 关键，加载MuJoCo状态数据

# 🎬 视频保存配置详解：
# 【训练阶段视频】(features.save_video + features.n_video_training):
#   - 用途: 记录训练过程中的rollout数据收集
#   - 时机: 每次调用collect_rollouts_ript_vla_style时
#   - 频率: 根据训练频率，可能很频繁
#   - 建议: 设置较少视频数或关闭，避免存储爆炸
#   
# 【评估阶段视频】(rollout.n_video + rollout.n_video_final):
#   - 用途: 记录模型评估性能和最终展示
#   - 时机: 定期评估 + 最终评估
#   - 频率: 相对较少，按评估频率
#   - 建议: 可以保存更多视频用于分析和展示
